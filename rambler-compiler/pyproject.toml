[project]
name = "rambler-compiler"
version = "0.4.0"
description = "Speech-to-clean-text compiler fine-tuning and evaluation pipeline (Qwen3.5-0.8B) — V4 rule-based hybrid dataset"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.0",
]

[project.optional-dependencies]
eval = [
    "jiwer>=3.0",
]
training = [
    "transformers==5.16.1",
    "peft==0.20.0",
    "trl==1.12.0",
    "accelerate==1.14.0",
    "bitsandbytes>=0.45",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
